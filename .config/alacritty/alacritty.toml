[general]
import = ["~/.config/alacritty/colorscheme.toml"]
[env]
WINIT_X11_SCALE_FACTOR = "1.0"
[window]
opacity = 0.8
[scrolling]
history = 20000
multiplier = 1
[colors.primary]
background = "#000000"
[colors]
draw_bold_text_with_bright_colors = true
[font]
size=11.5
[mouse]
hide_when_typing = true
[keyboard]
bindings = [
    { key = "J", mods = "Alt", mode = "~Alt", action = "ScrollLineDown" },
    { key = "K", mods = "Alt", mode = "~Alt", action = "ScrollLineUp" },
    { key = "PageUp", mode = "~Alt", action = "ScrollPageUp" },
    { key = "PageDown", mode = "~Alt", action = "ScrollPageDown" }
 ]
